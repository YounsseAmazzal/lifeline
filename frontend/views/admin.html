<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <title>LifeLine Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/main.css">
    <style>body { font-family: 'Cairo', sans-serif; }</style>
</head>
<body class="bg-slate-100 flex h-screen overflow-hidden">
    <!-- Global Confirm Modal -->
<div id="globalConfirmModal" class="confirm-overlay">
  <div class="confirm-box">
    <div class="confirm-title">تأكيد</div>
    <div class="confirm-message" id="confirmMessage"></div>
    <div class="confirm-buttons">
      <button id="confirmCancel" class="btn cancel">إلغاء</button>
      <button id="confirmOk" class="btn confirm">تأكيد</button>
    </div>
  </div>
</div>
    <!-- Sidebar -->
    <aside class="w-64 bg-[#0f172a] text-white flex flex-col shadow-2xl">
        <div class="p-6 text-center border-b border-slate-800">
            <h1 class="text-2xl font-bold text-red-500">LifeLine <span class="text-white text-xs block">Control Center</span></h1>
        </div>
        <nav class="flex-1 p-4 space-y-2">
            <button onclick="showTab('requests')" class="w-full text-right px-4 py-3 bg-red-600 rounded-lg font-bold text-sm shadow-lg hover:bg-red-700 transition">
                <i class="fa-solid fa-bell mr-2 ml-2"></i> الطلبات الجديدة
            </button>
            <button onclick="showTab('users')" class="w-full text-right px-4 py-3 text-slate-400 hover:bg-slate-800 rounded-lg font-bold text-sm transition">
                <i class="fa-solid fa-users mr-2 ml-2"></i> المستخدمين
            </button>
            <button onclick="showTab('banks')" class="w-full text-right px-4 py-3 text-slate-400 hover:bg-slate-800 rounded-lg font-bold text-sm transition">
                <i class="fa-solid fa-hospital mr-2 ml-2"></i> بنوك الدم
            </button>
        </nav>
        <div class="p-4 border-t border-slate-800">
            <a href="../auth/login.html" class="block text-center text-xs text-red-400 hover:text-red-300">تسجيل الخروج</a>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 p-8 overflow-y-auto">
        
        <div id="tab-requests" class="tab-content">
            <h2 class="text-2xl font-bold text-slate-800 mb-6">طلبات التبرع (في الانتظار)</h2>
            <div class="bg-white rounded-xl shadow border border-slate-200 overflow-hidden">
                <table class="w-full text-right">
                    <thead class="bg-slate-50 text-slate-500 text-xs font-bold">
                        <tr><th class="p-4">المريض</th><th class="p-4">الزمرة</th><th class="p-4">المستشفى</th><th class="p-4">الحالة</th><th class="p-4">إجراء</th></tr>
                    </thead>
                    <tbody id="reqTable" class="divide-y divide-slate-100 text-sm">
                        <!-- JS Loads Here -->
                        <tr><td colspan="5" class="p-4 text-center">جاري التحميل...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div id="tab-users" class="tab-content hidden">
            <h2 class="text-2xl font-bold text-slate-800 mb-6">قائمة المستخدمين</h2>
            <div class="bg-white rounded-xl shadow border border-slate-200 p-6 text-center text-slate-400">
                <i class="fa-solid fa-users text-4xl mb-2"></i>
                <p>قريباً...</p>
            </div>
        </div>

        <!-- SECTION 3: BANKS (Hidden) -->
        <div id="tab-banks" class="tab-content hidden">
            <h2 class="text-2xl font-bold text-slate-800 mb-6">إدارة بنوك الدم</h2>
            <div class="bg-white rounded-xl shadow border border-slate-200 p-6 text-center text-slate-400">
                <i class="fa-solid fa-hospital text-4xl mb-2"></i>
                <p>قريباً...</p>
            </div>
        </div>

    </main>
    <script src="../api/api.js"></script>
    <script src="../api/admin/adminrequest.js"></script>
    <script src="../assets/js/lang.js"></script>
    <script src="../api/globalalert.js"></script>
</body>
</html>
